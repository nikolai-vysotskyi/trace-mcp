# Single source of truth for the GitHub star counts quoted in the comparison
# tables (TRA-419). The same metric used to carry three values inside one site —
# codebase-memory-mcp was 41.0K on its own /vs/ page and 41.2K in two tables on
# comparisons.md — because every table kept its own copy and a verification pass
# updated some of them.
#
# `stars` is the display string the tables render; `stars_exact` is what the
# GitHub API returned on `verified`. tests/docs/competitor-stars.test.ts checks
# the two agree, so a hand-edited display string cannot drift from its receipt.
#
# Dated prose elsewhere on the page ("41.1K -> 41.2K this pass") is a historical
# record of a verification pass, not a live figure: leave those alone.
