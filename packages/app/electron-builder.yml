appId: com.trace-mcp.app
productName: trace-mcp
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
  - assets/**
  - build/icon.png
  # The renderer's dependencies are all bundled into dist/renderer by Vite, so
  # they live in devDependencies — electron-builder only packages production
  # `dependencies`, which keeps the 27.5 MB of @luma.gl/@cosmos.gl/micromark
  # that nothing ever loads out of the bundle (TRA-257). The one production
  # dependency left is electron-updater, which the main process needs at
  # runtime on Windows, so node_modules is no longer excluded wholesale.
  # (`files` is an allow-list once it contains any inclusion pattern, so
  # node_modules has to be named explicitly to be packaged at all.)
  - node_modules/**
  - '!dist/main/__tests__/**'
# electron-updater's feed, for both platforms: `latest-mac.yml` next to the
# macOS zips and `latest.yml` next to the Windows installer. macOS was held
# back from this while its builds were ad-hoc signed — Squirrel.Mac validates
# the replacement bundle's signature and would have rejected every one. Signing
# landed in TRA-436 and the fallback updater was deleted in TRA-437, so the feed
# is published for both.
publish:
  - provider: github
    owner: nikolai-vysotskyi
    repo: trace-mcp

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Signed with a Developer ID Application certificate and notarized by Apple
  # since 2026-08-29 (TRA-436). Before that the build came out ad-hoc signed, so
  # any browser download carried com.apple.quarantine and Gatekeeper refused it
  # as "damaged". Credentials come from CI secrets — CSC_LINK,
  # CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
  # A build without them is unsigned and must not be published.
  hardenedRuntime: true
  # `spctl --assess` on the build machine tells us nothing the CI verification
  # step doesn't, and fails spuriously before the notarization ticket is
  # stapled. Real assessment happens after the release, on a downloaded DMG.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Boolean, not `{ teamId: ... }` — electron-builder 26 rejects the object form
  # ("configuration.mac.notarize should be a boolean"). The team is taken from
  # APPLE_TEAM_ID in the environment, alongside APPLE_ID and
  # APPLE_APP_SPECIFIC_PASSWORD, which notarytool needs anyway.
  notarize: true
  target:
    # Both shipped on purpose: the zip is what Squirrel.Mac swaps in (and the
    # only thing `latest-mac.yml` can point at), the DMG is what a human
    # downloads for a first install.
    - target: dmg
    - target: zip
# Fixed name per arch so the release-asset gate (scripts/verify-release-assets.mjs)
# can assert both DMGs are present. electron-builder's default drops the `-x64`
# suffix on Intel, which would make the two legs indistinguishable by name.
dmg:
  artifactName: ${productName}-${version}-${arch}.dmg

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false

linux:
  target: []
