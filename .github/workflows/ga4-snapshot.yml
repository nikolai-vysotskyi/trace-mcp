# Daily adoption snapshot from GA4 into docs/_data/adoption.yml.
#
# GA4 keeps event data for 14 months at most, so this file is the only durable
# record of the trend (TRA-273). Daily rather than hourly on purpose: the ping
# itself is one event per install per UTC day, and GA4 needs up to 48h to
# finish processing — polling faster would only re-read the same numbers.
name: GA4 adoption snapshot

on:
  schedule:
    - cron: '17 6 * * *' # daily, after the UTC day the ping counts against has closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Fetch snapshot
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: node scripts/ga4-snapshot.mjs

      - name: Commit if the numbers moved
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/_data/adoption.yml)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_data/adoption.yml
          git commit -m "chore(adoption): refresh GA4 snapshot"
          git push
