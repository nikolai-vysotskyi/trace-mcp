name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Force-publish this existing git tag (e.g. v1.38.0) when the normal release-please flow already created the tag but the publish job failed — or when a failed build left the release marked a prerelease because its assets were incomplete (TRA-566). Re-verifies the assets and returns it to stable.'
        required: false
        default: ''

permissions:
  contents: read

# Scorecard flags the five job-level `contents: write` grants below
# (release-please, the macOS/Windows build jobs, verify-release-assets, and
# sbom). They are accepted, not oversights: release-please has to push the
# release branch and cut the tag, the build jobs upload signed installers as
# release assets, verify-release-assets has to be able to take an incomplete
# release back out of `latest` (TRA-566), and sbom uploads one more asset.
# All are already scoped to the job, never top-level (TRA-255).

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Deliberately NOT secrets.GITHUB_TOKEN. GitHub suppresses workflow
      # triggering from GITHUB_TOKEN-authored pushes (loop prevention), so
      # the release PR's checks either never start or land in
      # "action_required" on every rebase (TRA-171). A fine-grained PAT
      # (Contents + Pull requests: read/write) is a real identity, so its
      # pushes trigger pull_request workflows normally. No `|| GITHUB_TOKEN`
      # fallback on purpose: if the PAT expires we want a loud failure here,
      # not a silent slide back into the stuck-checks behaviour.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Append upgrade instructions to release notes
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body --jq '.body')
          FOOTER=$(cat <<'UPGRADE'

          ---

          ### Upgrade

          ```bash
          npm install -g trace-mcp@latest
          trace-mcp init
          ```
          UPGRADE
          )
          # TRA-687: app builds <=3.10.0 (macOS/Windows) can't self-update, and
          # the fix ships inside the very updater those builds can't run. Their
          # only surface onto a live page is "View changelog", which opens
          # /releases — so the recovery note has to live in every release's
          # notes, not just the one that shipped the fix, for it to ever reach
          # them. Same append mechanism as the Upgrade footer above.
          RECOVERY=$(cat <<'RECOVERY'

          ---

          ### In-app updater stuck?

          App builds 3.10.0 and earlier on macOS/Windows can't update themselves — "Check for updates…" shows `Cannot set properties of undefined (setting 'autoDownload')` and does nothing. Reinstall by hand: [download the .dmg](https://trace-mcp.com/) (macOS), grab the `.exe` installer from this page (Windows), or run `trace-mcp install-app` if you have the CLI.
          RECOVERY
          )
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "${BODY}${FOOTER}${RECOVERY}"

  # Gate between the app builds and npm, and the one place that can take a
  # release back out of `latest`. The release exists the moment the tag is cut,
  # but the zips land 2-5 minutes later from the matrix jobs below.
  # scripts/postinstall-app.mjs resolves the
  # update from /releases/latest and returns silently when the arch zip or its
  # .sha256 is not there yet — so every `npm install -g trace-mcp` inside that
  # window updates the CLI and quietly leaves the old `.app` behind, with no
  # error anywhere. `publish` therefore waits for this job: npm never
  # advertises a version whose artifacts are not already downloadable.
  #
  # `always()` so the workflow_dispatch republish path still runs it — there
  # the build jobs are skipped and the assets are already on the tag.
  verify-release-assets:
    needs: [release-please, build-app-mac, build-app-win]
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event.inputs.publish_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.publish_tag != '' && github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert every updater artifact is on the release
        id: assert
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets' \
            | node scripts/verify-release-assets.mjs "${TAG#v}"

      # TRA-566: this gate named the v3.9.0 problem exactly and still left every
      # Windows install broken, because it runs after the release is public and
      # newest. Windows electron-updater reads latest.yml off /releases/latest
      # and nothing else; v3.9.0 had none and never would, so the check found no
      # feed — no error the user sees, and no installer to fetch by hand either.
      # A red CI run does not help a user whose updater is pointed at it.
      #
      # So take the release back out of `latest` when its assets do not verify.
      # `prerelease` is the flag that does this — /releases/latest is documented
      # and observed to skip prereleases and fall back to the previous stable
      # release. It is also honest: a release missing half its installers IS a
      # prerelease.
      #
      # The obvious-looking alternative does NOT work. PATCHing the release with
      # `make_latest=false` returns 200 and changes nothing. Measured on a
      # scratch repo, polling /releases/latest until it settled (the endpoint is
      # eventually consistent, so a single read right after a mutation lies):
      #
      #   PATCH newest make_latest=false  → latest unchanged   (no-op)
      #   PATCH newest prerelease=true    → latest falls back   ✓
      #   PATCH newest prerelease=false   → latest returns
      #
      # Nor can we pick the fallback ourselves by walking back to "the last
      # complete release": the expected asset set changes over time, so older
      # releases fail today's audit for reasons that were never faults. v3.8.0
      # has no latest-mac.yml because macOS only moved to electron-updater in
      # 3.9.0 (TRA-437). GitHub's own fallback does not have that problem.
      - name: Take an incomplete release out of `latest`
        if: failure() && steps.assert.outcome == 'failure'
        run: |
          ID=$(gh release view "$TAG" --repo "${{ github.repository }}" --json databaseId --jq '.databaseId')
          if [ -z "$ID" ]; then
            echo "::error::could not resolve a release id for $TAG — it may still be \`latest\` while incomplete"
            exit 1
          fi
          # Retried: losing this one call is precisely the TRA-566 outcome.
          for i in 1 2 3; do
            if gh api -X PATCH "repos/${{ github.repository }}/releases/$ID" -F prerelease=true --silent; then
              echo "::warning::$TAG is incomplete and has been marked a prerelease; /releases/latest falls back to the previous stable release"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$TAG is incomplete and could NOT be demoted — users are still being offered a broken release"
          exit 1

      # The un-stick path. Re-running this workflow with `publish_tag` after the
      # assets are fixed re-verifies them and returns the release to stable.
      # A no-op on the normal path, where the release is already stable.
      - name: Return a now-complete release to stable
        run: |
          ID=$(gh release view "$TAG" --repo "${{ github.repository }}" --json databaseId --jq '.databaseId')
          if [ "$(gh api "repos/${{ github.repository }}/releases/$ID" --jq .prerelease)" != "true" ]; then
            exit 0
          fi
          for i in 1 2 3; do
            gh api -X PATCH "repos/${{ github.repository }}/releases/$ID" -F prerelease=false --silent && exit 0
            sleep 5
          done
          echo "::error::$TAG verified but could not be returned to stable — users will not be offered it"
          exit 1

  # An SPDX SBOM is the first artifact an enterprise evaluator asks for, and
  # GitHub already builds one from the dependency graph — no scanner, no
  # service, one API call (TRA-902). Deliberately not a gate on anything: a
  # missing SBOM is a paperwork problem, not a broken release.
  sbom:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event.inputs.publish_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.publish_tag != '' && github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Generate and attach the SPDX SBOM
        run: |
          set -euo pipefail
          FILE="trace-mcp-${TAG#v}.spdx.json"
          # DEPRECATED, Sunset: 2026-11-13 (headers on the response itself;
          # github.blog/changelog/2026-05-12-synchronous-sbom-api-deprecated).
          # The successor is async — POST .../sbom/generate-report, then poll
          # .../fetch-report/{uuid} — and returned 404 when probed on
          # 2026-09-05, so it is not yet usable here. Migrate before the
          # sunset or this step starts failing (TRA-908).
          gh api "repos/${{ github.repository }}/dependency-graph/sbom" --jq .sbom > "$FILE"
          # An empty package list means the dependency graph had not been
          # ingested for this commit yet — better to fail loudly than to ship
          # an SBOM that claims we depend on nothing.
          test "$(jq '.packages | length' "$FILE")" -gt 1
          gh release upload "$TAG" "$FILE" --repo "${{ github.repository }}" --clobber

  # TRA-368: the asset gate above proves latest.yml is ON the release. It cannot
  # prove an install would act on it — a feed whose sha512 no longer matches the
  # installer beside it passes that check and still leaves every Windows install
  # unable to update, silently. This installs the previous release and updates it
  # for real. Deliberately NOT a `needs:` of `publish`: it takes ~10 minutes and
  # a failure here does not make the npm package wrong.
  verify-win-update:
    needs: [release-please, verify-release-assets]
    if: needs.release-please.outputs.release_created == 'true' || github.event.inputs.publish_tag != ''
    uses: ./.github/workflows/verify-win-update.yml

  publish:
    needs: [release-please, verify-release-assets]
    if: needs.release-please.outputs.release_created == 'true' || github.event.inputs.publish_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TSUP_TARGET: node22
      TRACE_MCP_NO_POSTINSTALL: '1'
      TRACE_MCP_NO_AUTO_UPDATE: '1'
      CI: 'true'
      # Baked into the published build's anonymous active-install ping
      # (src/telemetry/usage-ping.ts) via tsup.config.ts's `define` block.
      # Public by design: both values ship as plaintext in dist/ and a GA4
      # api_secret is write-only. Stored as Actions secrets for convenience,
      # not confidentiality — see SECURITY.md "Telemetry Credentials".
      # TRACE_MCP_TELEMETRY=off still disables it at runtime.
      TRACE_MCP_GA_MEASUREMENT_ID: ${{ secrets.TRACE_MCP_GA_MEASUREMENT_ID }}
      TRACE_MCP_GA_API_SECRET: ${{ secrets.TRACE_MCP_GA_API_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Dispatch override > release-please's freshly cut tag.
          ref: ${{ github.event.inputs.publish_tag != '' && github.event.inputs.publish_tag || needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The active-install ping is our adoption metric of record (TRA-273), and
      # its only silent failure mode is the secrets above not reaching tsup's
      # `define` — the build still succeeds and every install then reports
      # nothing, which looks identical to having no users. GA4's Measurement
      # Protocol answers 204 even for a wrong api_secret, so this cannot be
      # checked at runtime; check the built bundle instead.
      - name: Assert telemetry credentials were baked into the bundle
        run: |
          node -e '
            const s = require("fs").readFileSync("dist/index.js", "utf8");
            if (!/"G-[A-Z0-9]{6,}"/.test(s))
              throw new Error("usage ping has no baked GA measurement id — TRACE_MCP_GA_* secrets did not reach the build");
          '
      # Same exclusions as ci.yml :: test step (hang in toon-drift etc).
      - run: pnpm exec vitest run --exclude='tests/perf/**' --exclude='tests/fixtures/**' --exclude='tests/languages/test_xml.test.ts' --exclude='tests/integration/**' --exclude='tests/daemon/**' --exclude='src/telemetry/__tests__/**' --exclude='src/tools/register/__tests__/toon-drift.test.ts' --exclude='tests/util/debounce-abort.test.ts' --testTimeout=30000 --hookTimeout=15000 --teardownTimeout=15000
      # pnpm 10's `--provenance` flow signs the sigstore attestation
      # successfully but the subsequent `PUT /trace-mcp` to the npm
      # registry returns 404 — the OIDC-token-to-npm-scoped-token swap
      # for trusted publishers isn't implemented compatibly. v1.33.0 was
      # published cleanly with the npm-CLI workaround below; v1.34.0 and
      # v1.34.1 both failed under pnpm publish (runs 25635344085 and
      # 25635744167). Stay on `npx -y npm@11 publish` until pnpm fixes
      # the trusted-publisher exchange.
      - run: npx -y npm@11 publish --provenance --access public

  build-app-mac:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    # The Developer ID certificate lives in this environment, not at repository
    # level, and the environment only deploys from protected branches (TRA-628).
    # That is what keeps the signing identity out of reach of a workflow added
    # on some other branch — `on: push: branches: [master]` above is a property
    # of this file, and a repository-level secret is readable by any workflow
    # that names it. Removing this line silently un-gates the certificate.
    environment: apple-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Both architectures in ONE job, not a matrix leg each. electron-builder
    # writes a single `latest-mac.yml` per invocation, listing only the files
    # that invocation produced, and both legs upload to the same release — so a
    # matrix would have one arch clobber the other's feed and leave that arch
    # polling for a build it can never be offered (TRA-437).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install root dependencies and build server
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install app dependencies
        working-directory: packages/app
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: packages/app
        run: pnpm run build

      - name: Sync app version from root package.json
        working-directory: packages/app
        run: |
          ROOT_VERSION=$(node -p "require('../../package.json').version")
          npm pkg set version="$ROOT_VERSION"

      # TRA-844: import the Developer ID certificate ourselves instead of letting
      # electron-builder do it. Given CSC_LINK it builds a temp keychain and then
      # calls `security set-key-partition-list -k <p12 password>` — the
      # certificate's password where the *keychain's* password belongs
      # (app-builder-lib 26.15.7, out/codeSign/macCodeSign.js `importCerts`).
      # That only ever worked because `security` skipped the unlock on an already
      # unlocked keychain; macOS 26.6 (Darwin 25.6.0, the runner image since
      # 2026-09-03) unlocks unconditionally, so the wrong password is now fatal:
      #
      #   security: SecKeychainUnlock: The user name or passphrase you entered is not correct.
      #
      # v3.16.0 and v3.17.0 both died there and never produced a mac asset, which
      # failed verify-release-assets and silently skipped `publish` — npm sat on
      # 3.15.0 for two releases. Nothing about the certificate changed.
      #
      # With CSC_LINK unset electron-builder signs out of `CSC_KEYCHAIN` instead
      # (out/macPackager.js) and never runs the broken sequence. The DMG step
      # below needed its own import anyway, so this is one keychain for the job
      # rather than two, and the upstream bug is simply not on our path.
      - name: Import the Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Keychain and the decoded .p12 both live in RUNNER_TEMP, which the
          # runner discards, and the .p12 is deleted as soon as it is imported.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/signing.p12"
          KEYCHAIN_PASSWORD=$(uuidgen)
          printenv CSC_LINK | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"  # no auto-lock mid-notarization
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$P12"
          # Without this, codesign blocks on an "allow access" prompt that no one
          # can answer on a runner. `-k` is the KEYCHAIN password here — passing
          # the .p12 password instead is the upstream bug described above.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Fail here rather than let electron-builder fall back to an ad-hoc
          # signature and report it as a warning.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application'; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Sign + notarize (TRA-436). The certificate never leaves this job; it
      # reaches the job only because the job declares `environment: apple-signing`
      # above, and only on a protected branch. electron-builder reads
      # CSC_KEYCHAIN for the Developer ID identity and APPLE_* for notarytool;
      # it prints neither.
      # Do not add `--debug` here: it dumps the resolved env.
      - name: Package with electron-builder
        working-directory: packages/app
        env:
          CSC_KEYCHAIN: ${{ env.SIGNING_KEYCHAIN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish never

      # electron-builder notarizes the .app in `afterSign` and only then
      # assembles the DMG around it, so the container a human actually downloads
      # carried no signature and no ticket of its own through 3.10.0 — Gatekeeper
      # had nothing to assess when it mounted the image (TRA-627). Sign, notarize
      # and staple the DMG itself, in that order, before checksums and the
      # provenance attestation are computed over it.
      #
      # `dmg.sign: true` in electron-builder.yml is deliberately not used: it
      # runs `codesign --sign` with no `--timestamp`, and notarization rejects a
      # signature without a secure timestamp. Signing here also keeps the whole
      # container step in one place.
      - name: Sign, notarize and staple the DMGs
        working-directory: packages/app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$SIGNING_KEYCHAIN"

          # By hash, not by name: the certificate's common name is not one of the
          # secrets, and a near-miss name would silently pick the wrong identity.
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            exit 1
          fi

          for DMG in release/*.dmg; do
            codesign --sign "$IDENTITY" --timestamp --keychain "$KEYCHAIN" "$DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$DMG"
          done

      # electron-builder reports a skipped signature as a warning and exits 0,
      # so a missing or expired certificate would publish an ad-hoc build that
      # Gatekeeper rejects — the exact TRA-436 symptom — with a green release.
      # Assert the real properties instead: a Developer ID team identifier, and
      # a stapled notarization ticket. Both the .app and the DMG around it are
      # checked: 3.10.0 shipped a correct app inside a container with neither
      # (TRA-627), and only an assertion on the container itself notices that.
      - name: Assert the app and the DMG are signed and notarized
        working-directory: packages/app
        run: |
          # Both arches, each asserted: one leg silently ad-hoc signed would
          # leave that architecture unable to install any update at all.
          APPS=$(find release/mac* -maxdepth 1 -name '*.app')
          if [ -z "$APPS" ]; then echo "::error::no .app produced"; exit 1; fi
          echo "$APPS" | while read -r APP; do
            codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier'
            if codesign -dv "$APP" 2>&1 | grep -q 'TeamIdentifier=not set'; then
              echo "::error::$APP is ad-hoc signed — the signing keychain did not reach electron-builder"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$APP"
            xcrun stapler validate "$APP"
            spctl -a -vvv -t install "$APP"
          done

          # The container, assessed the way DiskImageMounter assesses it —
          # `-t open`, primary signature, which is what 3.10.0's DMG failed.
          DMGS=$(find release -maxdepth 1 -name '*.dmg')
          if [ -z "$DMGS" ]; then echo "::error::no DMG produced"; exit 1; fi
          echo "$DMGS" | while read -r DMG; do
            # Diagnostics first: on a failure below, this is the line that says why.
            codesign -dv --verbose=4 "$DMG" 2>&1 || true
            if ! codesign --verify --strict "$DMG" 2> /dev/null; then
              echo "::error::$DMG carries no valid signature — the DMG signing step did not sign this image"
              exit 1
            fi
            xcrun stapler validate "$DMG"
            spctl -a -vvv -t open --context context:primary-signature "$DMG"
          done

      # electron-updater reads `latest-mac.yml` and nothing else. A build that
      # ships the zips without it is silently un-updatable for every macOS
      # install in the field, so a missing feed is a failed release — the same
      # gate the Windows leg has had since TRA-360.
      - name: Assert latest-mac.yml was generated and covers both arches
        working-directory: packages/app
        run: |
          FEED=release/latest-mac.yml
          if [ ! -f "$FEED" ]; then
            echo "::error::packages/app/$FEED missing — check the top-level publish block in packages/app/electron-builder.yml"
            exit 1
          fi
          cat "$FEED"
          COUNT=$(grep -cE 'url: .*-mac\.zip$' "$FEED")
          if [ "$COUNT" -ne 2 ] || ! grep -qE 'url: .*-arm64-mac\.zip$' "$FEED"; then
            echo "::error::$FEED lists $COUNT mac zips — expected both arm64 and x64, or one architecture polls a feed that never offers it a build"
            exit 1
          fi

      - name: Generate SHA-256 per-asset checksums
        run: node scripts/generate-shasums.mjs packages/app/release .zip .dmg

      - name: Generate SLSA build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/app/release/*.zip
            packages/app/release/*.dmg

      # The attestation above lives in GitHub's attestation API, which needs
      # network access to a service that must still be up, and which OpenSSF
      # Scorecard does not look at (Signed-Releases counts release assets only).
      # The same sigstore bundle attached to the release makes verification
      # offline-capable — `gh attestation verify --bundle` — and is what a
      # mirror or an air-gapped evaluator can actually check (TRA-902).
      - name: Attach the provenance bundle to the release
        run: cp "${{ steps.attest.outputs.bundle-path }}" "packages/app/release/trace-mcp-mac.intoto.jsonl"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            packages/app/release/*.zip \
            packages/app/release/*.zip.sha256 \
            packages/app/release/*.dmg \
            packages/app/release/*.dmg.sha256 \
            packages/app/release/trace-mcp-mac.intoto.jsonl \
            packages/app/release/latest-mac.yml \
            --clobber

      # RUNNER_TEMP is discarded anyway; this also drops the keychain out of the
      # search list on a self-hosted runner, and runs even when a step above
      # failed with the certificate still imported.
      - name: Remove the signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN" || true

  build-app-win:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install root dependencies and build server
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install app dependencies
        working-directory: packages/app
        run: pnpm install --frozen-lockfile

      - name: Generate icons (including .ico for Windows)
        working-directory: packages/app
        run: node scripts/generate-icons.mjs

      - name: Build app
        working-directory: packages/app
        run: pnpm run build

      - name: Sync app version from root package.json
        working-directory: packages/app
        shell: bash
        run: |
          ROOT_VERSION=$(node -p "require('../../package.json').version")
          npm pkg set version="$ROOT_VERSION"

      - name: Package with electron-builder
        working-directory: packages/app
        run: pnpm exec electron-builder --win --x64 --publish never

      # electron-updater is the Windows update mechanism (TRA-360) and it is
      # driven entirely by latest.yml. A build that ships the installer without
      # it is silently un-updatable — every existing install would keep polling
      # a 404 forever — so treat a missing latest.yml as a failed release, not
      # as a warning.
      - name: Assert latest.yml was generated
        shell: bash
        run: |
          if [ ! -f packages/app/release/latest.yml ]; then
            echo "::error::packages/app/release/latest.yml missing — electron-updater metadata was not generated; check the win.publish block in packages/app/electron-builder.yml"
            exit 1
          fi
          cat packages/app/release/latest.yml

      - name: Generate SHA-256 checksums
        shell: bash
        run: node scripts/generate-shasums.mjs packages/app/release .exe .zip

      - name: Generate SLSA build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/app/release/*.exe
            packages/app/release/*-win*.zip

      # See the matching step in build-app-mac for why the bundle is uploaded
      # as well as registered with GitHub's attestation API (TRA-902).
      # pwsh, not bash: the action emits a Windows path with backslashes and
      # Git Bash's handling of those is not worth relying on here.
      - name: Attach the provenance bundle to the release
        run: Copy-Item "${{ steps.attest.outputs.bundle-path }}" "packages/app/release/trace-mcp-win.intoto.jsonl"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          FILES=(packages/app/release/*.exe packages/app/release/*-win*.zip)
          SUMS=(packages/app/release/*.exe.sha256 packages/app/release/*-win*.zip.sha256)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No artifacts found to upload"
            exit 1
          fi
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${FILES[@]}" \
            "${SUMS[@]}" \
            packages/app/release/trace-mcp-win.intoto.jsonl \
            packages/app/release/latest.yml \
            --clobber
