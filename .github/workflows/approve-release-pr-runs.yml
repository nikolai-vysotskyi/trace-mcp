name: Approve release-please PR runs

# release-please (see release.yml) opens/rebases its release PR by pushing
# with secrets.GITHUB_TOKEN. GitHub doesn't recognize that bot push as a
# repo collaborator for pull_request-triggered runs, so CI/CodeQL/Semgrep/
# Eval land in "action_required" on every rebase — even though the PR is
# same-repo, not a fork (see TRA-171).
#
# A pull_request_target trigger here does NOT work around that: pushes
# made with GITHUB_TOKEN don't trigger *any* workflow event, not just
# pull_request (this is the same loop-prevention rule release.yml's
# impact-report job already works around — see the comment above it).
# Confirmed via TRA-171 follow-up: the pull_request_target-triggered
# version of this workflow never fired for a single release-please
# rebase. Poll on a schedule instead, which is immune to that rule.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write
  pull-requests: read

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve any action_required runs on open release-please PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          pr_shas=$(gh pr list --repo "${REPO}" --search "head:release-please--branches--" --json headRefOid --jq '.[].headRefOid')
          if [ -z "$pr_shas" ]; then
            echo "No open release-please PRs."
            exit 0
          fi
          for sha in $pr_shas; do
            run_ids=$(gh api "repos/${REPO}/actions/runs?head_sha=${sha}&status=action_required" --jq '.workflow_runs[].id')
            for id in $run_ids; do
              echo "Approving run $id (head $sha)"
              gh api -X POST "repos/${REPO}/actions/runs/${id}/approve"
            done
          done
