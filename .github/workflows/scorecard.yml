name: OSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "31 3 * * 1"
  push:
    branches: [master]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # ponytail: tolerate transient publish flakes, don't mask real failures.
        # publish_results uploads the public OpenSSF score to
        # api.securityscorecards.dev, which intermittently times out
        # ("context deadline exceeded") and fails this whole required check
        # (e.g. run 27633150872). The SARIF is written before that upload, so
        # code-scanning + the README badge still work; continue-on-error swallows
        # only the flaky publish — a genuine analysis failure produces no SARIF
        # and still reddens the upload-sarif step below.
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
