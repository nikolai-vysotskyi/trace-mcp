name: Eval

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-check:
    name: Retrieval-quality baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The eval harness queries trace-mcp's `search` against the host
      # project's index — we need an index on disk before `eval run` can
      # do anything useful. `index` requires the project to be registered
      # first; `add --no-index` registers without doing a (slower) full
      # indexing pass, since the next step does that explicitly with --force.
      - name: Register project
        run: node dist/cli.js add . --no-index

      - name: Index project
        run: node dist/cli.js index . --force

      - name: Run eval with baseline check
        run: node dist/cli.js eval run --dataset default --check-baseline
