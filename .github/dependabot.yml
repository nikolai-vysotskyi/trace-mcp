version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: "web-tree-sitter"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /packages/app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
      - app
    commit-message:
      prefix: chore(app-deps)
      prefix-development: chore(app-deps-dev)
      include: scope
    ignore:
      - dependency-name: "vite"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      - dependency-name: "electron"
        update-types:
          - version-update:semver-major
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
      include: scope
    groups:
      # codeql-action's init / analyze / upload-sarif steps MUST move in
      # lockstep: a mixed version pair fails CodeQL with
      # "Loaded a configuration file for version X, but running version Y".
      # Keep every github/codeql-action ref in a single PR across all update
      # types so it can never be split into individually-failing PRs.
      codeql-action:
        patterns:
          - "github/codeql-action*"
        update-types:
          - major
          - minor
          - patch
      # Batch remaining routine minor/patch action bumps into one PR.
      # Major bumps of other actions are left as individual PRs for review.
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
