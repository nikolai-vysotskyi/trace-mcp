version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Supply-chain: wait before proposing a freshly published version, so a
    # compromised-maintainer publish has time to be yanked upstream.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
      include: scope
    ignore:
      # @types/node tracks the minimum supported runtime, not the latest: a
      # major bump would type-check against APIs that do not exist on the
      # runtime floor declared in `engines.node` (now >=22). Move this major
      # only when that floor moves, and move both together.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # commander@15 declares `engines.node >=22.12.0`; our `engines.node` is
      # >=22.0.0, so taking it would silently break installs on Node 22.0-22.11
      # without a support-policy change we have no reason to make — commander 14
      # is doing the job. Removed in #482 on the assumption that the >=22 floor
      # already covered it (TRA-329); restored in TRA-463 with the exact gap
      # written down. Lift this together with the `engines.node` floor.
      #
      # Note for whoever lifts it: this YAML entry is not the only thing holding
      # commander 15 back. PR #197 was closed with `@dependabot ignore this
      # major version`, which lives in Dependabot's own per-repo state — deleting
      # the entry here does NOT clear it. Comment `@dependabot unignore
      # commander` on any Dependabot PR (or reopen #197) as well.
      - dependency-name: "commander"
        update-types:
          - version-update:semver-major
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /packages/app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Supply-chain: wait before proposing a freshly published version, so a
    # compromised-maintainer publish has time to be yanked upstream.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
      - app
    commit-message:
      prefix: chore(app-deps)
      prefix-development: chore(app-deps-dev)
      include: scope
    ignore:
      # Vite 8 switches the default bundler to Rolldown, which fails on
      # @cosmos.gl/graph's transitive `gl-bench` dep (stricter CJS default
      # import handling) — PR #95. @vitejs/plugin-react v6 requires Vite 7+
      # (PR #91), so the two move together or not at all. Still live as of
      # TRA-329: @cosmos.gl/graph is unchanged at 3.4.1. Lift only once an app
      # build on Vite 8 has been verified green.
      - dependency-name: "vite"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      # Originally held because menubar@9.5.2 pinned `electron <35.0.0`.
      # menubar was dropped in the TRA-257 artifact-slimming work and the app
      # is on Electron 41, so that blocker is gone. Kept anyway (decided in
      # TRA-329) on its own merit: an Electron major moves Chromium, Node and
      # the packaging / signing / notarization surface at once and needs a
      # manual build-and-sign pass per target platform, so it must never
      # arrive as an auto-mergeable dependency PR. Bump it deliberately.
      - dependency-name: "electron"
        update-types:
          - version-update:semver-major
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Supply-chain: wait before proposing a freshly published version, so a
    # compromised-maintainer publish has time to be yanked upstream.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore(ci)
      include: scope
    groups:
      # codeql-action's init / analyze / upload-sarif steps MUST move in
      # lockstep: a mixed version pair fails CodeQL with
      # "Loaded a configuration file for version X, but running version Y".
      # Keep every github/codeql-action ref in a single PR across all update
      # types so it can never be split into individually-failing PRs.
      codeql-action:
        patterns:
          - "github/codeql-action*"
        update-types:
          - major
          - minor
          - patch
      # Batch remaining routine minor/patch action bumps into one PR.
      # Major bumps of other actions are left as individual PRs for review.
      github-actions-minor-patch:
        update-types:
          - minor
          - patch
