# pnpm 12+ project config (npm does not read this file).
# Supply-chain quarantine: 10080 minutes = 7 days — keep in sync with min-release-age in .npmrc.
packages:
  - "."

overrides:
  zod: 4.3.6
  qs: ">=6.16.0"
  protobufjs@<8.6.6: ">=8.6.6"
  hono: ">=4.13.5"
  "@hono/node-server": ">=2.0.5"
  js-yaml: ">=4.3.2"
  undici: ">=8.9.0"
  vite: ">=8.0.16"
  esbuild: ">=0.28.1"
  sharp: ">=0.35.4"
  fast-uri: ">=4.1.4"
  ip-address: ">=10.5.1"
  adm-zip: ">=0.6.1"
  body-parser: ">=2.3.0"
  postcss: ">=8.5.23"
  nanoid: ">=3.3.17"

allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  onnxruntime-node: true
  simple-git-hooks: true
  protobufjs: true

supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - adm-zip@0.6.1
